[package]
name = "containeria-app"
description = "The Containeria desktop app: window, menu bar item and the commands the UI calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "containeria_app"
crate-type = ["rlib"]

[[bin]]
name = "containeria"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
containeria-data.workspace = true
containeria-docker.workspace = true
containeria-engine.workspace = true
containeria-kube.workspace = true
containeria-machines.workspace = true
containeria-net.workspace = true
flate2.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tar.workspace = true
tauri = { workspace = true, features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-window-state.workspace = true
tauri-specta.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

