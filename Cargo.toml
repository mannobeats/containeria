[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/mannobeats/containeria"
authors = ["The Containeria Authors"]
publish = false

[workspace.dependencies]
containeria-engine = { path = "crates/engine" }
containeria-docker = { path = "crates/docker" }
containeria-kube = { path = "crates/kube" }
containeria-machines = { path = "crates/machines" }
containeria-data = { path = "crates/data" }
containeria-net = { path = "crates/net" }

anyhow = "1.0.104"
bollard = "0.21.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
clickhouse = { version = "0.15.3", features = ["native-tls"] }
csv = "1.4.0"
flate2 = "1.1.10"
futures = "0.3.34"
hickory-proto = "0.26.3"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
jiff = { version = "0.2.38", features = ["serde"] }
k8s-openapi = { version = "0.29.0", features = ["v1_35"] }
keyring = "4.2.0"
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring", "runtime", "ws"] }
mongodb = "3.9.1"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDateFormatter", "NSFormatter", "NSLocale", "NSString"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
redis = { version = "1.7.1", features = ["tokio-comp", "tokio-native-tls-comp"] }
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2"] }
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta-typescript = { version = "=0.0.12", features = ["serde"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "jiff"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "mysql", "sqlite", "json", "chrono", "uuid", "rust_decimal"] }
tar = "0.4.46"
tauri = "2.12.4"
tauri-build = "2.7.3"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "process", "fs", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
yaml_serde = "0.10.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
