name: Bug
description: Something doesn't work as it should.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: versions
    attributes:
      label: Containeria version, macOS version and Mac model
    validations: { required: true }
