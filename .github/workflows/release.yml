name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The kernel and system image the engine boots. They are Linux, so they build on Linux.
  guest:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the guest
        run: sh scripts/build-guest.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest
          path: apps/desktop/src-tauri/resources/engine/guest
          if-no-files-found: error

  # Signed with a Developer ID and notarized when the repository has the secrets that
  # scripts/setup-release-secrets.sh sets (see docs/release.md). Without them the build is
  # ad-hoc signed, and macOS asks about its first launch.
  macos:
    needs: guest
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      # Updates are only published signed and notarized: an installed app would replace itself
      # with whatever it is offered.
      HAS_UPDATE_KEY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - name: Import the signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          printf %s "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
          # For the steps that sign and notarize. Left unset, they sign ad-hoc and notarize nothing.
          {
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_ID=$NOTARY_APPLE_ID"
            echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Fetch the bundled tools
        run: sh scripts/fetch-tools.sh
      - name: Build the engine
        run: sh scripts/build-engine.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest
          path: apps/desktop/src-tauri/resources/engine/guest
      - name: Bundle cx
        run: |
          cargo build -p contena-cli --release --target aarch64-apple-darwin
          install -m 0755 target/aarch64-apple-darwin/release/cx apps/desktop/src-tauri/resources/tools/bin/cx
      - name: Sign what the app carries inside it
        run: sh scripts/sign-inside.sh
      - name: Build the app and disk image
        if: env.HAS_UPDATE_KEY != 'true'
        run: pnpm --filter @contena/desktop tauri build --target aarch64-apple-darwin --bundles app,dmg
      - name: Build the app, the disk image and the update archive
        if: env.HAS_UPDATE_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm --filter @contena/desktop tauri build --target aarch64-apple-darwin --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Notarize the disk image
        if: env.HAS_CERTIFICATE == 'true'
        run: sh scripts/notarize.sh target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      - name: Attest where the disk image came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- "$GITHUB_REF_NAME" --title "Contena $GITHUB_REF_NAME" --generate-notes
          if [ "$HAS_CERTIFICATE" != "true" ]; then
            set -- "$@" --notes "This build isn't signed with a Developer ID. Open it once, then allow it in System Settings > Privacy & Security > Open Anyway."
          fi
          set -- "$@" target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if [ "$HAS_UPDATE_KEY" = "true" ]; then
            archive=$(ls target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz)
            sh scripts/update-manifest.sh "$GITHUB_REF_NAME" "$archive" > "$RUNNER_TEMP/latest.json"
            set -- "$@" "$archive" "$RUNNER_TEMP/latest.json"
          fi
          gh release create "$@"
