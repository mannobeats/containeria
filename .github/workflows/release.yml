name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - name: Fetch the bundled tools
        run: sh scripts/fetch-tools.sh
      - name: Bundle cx
        run: |
          cargo build -p containeria-cli --release --target aarch64-apple-darwin
          install -m 0755 target/aarch64-apple-darwin/release/cx apps/desktop/src-tauri/resources/tools/bin/cx
      - name: Build the app and disk image
        run: pnpm --filter @containeria/desktop tauri build --target aarch64-apple-darwin --bundles app,dmg
      - name: Attest where the disk image came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Containeria $GITHUB_REF_NAME" --generate-notes \
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
